name: Scaffold story

# Push a branch named  story/<name>  and this creates content/<name>/index.md + assets/ on it.
# (Prefer the local command `npm run new -- <name>`: no waiting, no `git pull` afterwards.)
on:
  create:

permissions:
  contents: write

jobs:
  scaffold:
    if: github.ref_type == 'branch' && startsWith(github.ref_name, 'story/')
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.ref_name }}
      ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create content/<slug>/
        run: node scripts/new-story.mjs "${BRANCH#story/}" --no-branch --author="${ACTOR}"
      - name: Commit and push to the branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then echo "Already scaffolded."; exit 0; fi
          git commit -m "chore: scaffold ${BRANCH#story/}"
          git push origin "HEAD:${BRANCH}"
